<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- neves.cloud app icon — the Pip mark in its cool monochrome dress:
       near-white Pip (#ecedf1) on a cool near-black ground (#1c1d21),
       sampled from the source art. Pip is the pip-core Lucide-bot in its
       idle pose — left-pointing antenna (antenna-l), eyes open — drawn thick.
       Subtle 135deg ground, top sheen.

       FULL BLEED, and it is a trade, not a universal rule. An icon's shape has
       to match how its host treats it: a masking host wants full bleed plus a
       safe zone, a non-cropping one is happier with a rounded plate. termd
       serves both, splitting icon.svg (purpose any, plate) from
       icon-maskable.svg (purpose maskable, full bleed).

       This file cannot split, because one asset feeds two hosts that want
       opposite things. Browser tabs do not crop it; Claude's connector list
       does, resolving a custom connector's icon from the registrable domain.
       It carried rx="56" (about 22 percent) against Claude's tile at roughly
       7 percent, and that difference showed as four pale wedges on both
       neves.cloud connectors. Full bleed loses the plate in a 16px tab, where
       the radius was barely legible anyway, and fixes a 40px list where the
       wedges were glaring. The inset hairline went with the radius: under any
       mask it reads as a rounded outline floating inside a square.

       If a plate is ever wanted back in the tab, add icon-maskable.svg and
       point the tab at a plated icon.svg, the way termd does. Note that Claude
       reads the favicon, not a manifest, so whichever file the tab points at is
       the one it will crop. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23242a"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#ground)"/>
  <rect width="256" height="256" fill="url(#sheen)"/>

  <!-- Pip (native 24x24), idle pose: antenna-l points up-then-left. Thick. -->
  <g transform="translate(50,50) scale(6.5)" fill="none" stroke="#ecedf1"
     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 8V4H8"/>
    <rect width="16" height="12" x="4" y="8" rx="2"/>
    <path d="M2 14h2"/>
    <path d="M20 14h2"/>
    <path d="M9 13v2"/>
    <path d="M15 13v2"/>
  </g>
</svg>
