<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- neves.cloud app icon — the Pip mark in its cool monochrome dress:
       near-white Pip (#ecedf1) on a cool near-black ground (#1c1d21),
       sampled from the source art. Pip is the pip-core Lucide-bot in its
       idle pose — left-pointing antenna (antenna-l), eyes open — drawn thick.
       Subtle 135deg ground, top sheen.

       FULL BLEED, deliberately: ground to all four edges, no corner radius, no
       transparency. Every host that shows an app icon lays it on its own tile
       and applies its own mask — Apple included, which is why icon-apple.png
       beside this file is already square. An icon that rounds its own corners
       shows the tile through wherever its radius cuts in further than the
       host's, and it can only ever match one host. This carried rx="56" (≈22%)
       against Claude's connector tile at ≈7%, which is what put four pale
       wedges on both neves.cloud connectors. The inset hairline went with it:
       under a mask it reads as a rounded outline floating inside a square. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23242a"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#ground)"/>
  <rect width="256" height="256" fill="url(#sheen)"/>

  <!-- Pip (native 24x24), idle pose: antenna-l points up-then-left. Thick. -->
  <g transform="translate(50,50) scale(6.5)" fill="none" stroke="#ecedf1"
     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 8V4H8"/>
    <rect width="16" height="12" x="4" y="8" rx="2"/>
    <path d="M2 14h2"/>
    <path d="M20 14h2"/>
    <path d="M9 13v2"/>
    <path d="M15 13v2"/>
  </g>
</svg>
