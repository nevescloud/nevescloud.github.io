<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Unconditional, and no script. The e-ink user-agent branch that used to sit
       here (Kindle/Kobo/… -> /reader) read as a conditional cross-domain redirect
       and drew a Safe Browsing "Deceptive pages" flag on the whole domain; /reader
       answered 404 from its Cloudflare route the entire time, so it served nobody.
       E-ink readers use reader.neves.cloud, which the reader's own setup gives out. -->
  <meta http-equiv="refresh" content="0; url=https://jonasneves.com/">
  <link rel="canonical" href="https://jonasneves.com/">
  <title>Redirecting…</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 4rem auto;
      max-width: 32rem;
      padding: 0 1.5rem;
      color: #6e6e73;
      line-height: 1.5;
    }
    a { color: inherit; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1d20; color: #adb5bd; }
    }
  </style>
</head>
<body>
  <p>This has moved to <a href="https://jonasneves.com">jonasneves.com</a>.
     Reading on an e-reader? <a href="https://reader.neves.cloud/">reader.neves.cloud</a>.</p>
</body>
</html>
